name: Digital Double CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Orchestrator smoke
        run: python tests/test_orchestrator_smoke.py
